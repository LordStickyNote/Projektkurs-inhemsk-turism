<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resequiz</title>
    <link rel="icon" href="/img/logotyp.svg" type="image/svg+xml" />

    <script type="module" src="JS/quiz.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/CSS/style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/JS/footer.js"></script>
  </head>
  <body class="height-screen">
    <div id="quiz-wrapper" class="justify-center height-full stack gap-10">
      <div class="btn-back">
        <button id="backBtn" class="btn" type="button">Tillbaka</button>
      </div>
      <img class="explore-logo" src="/img/logotyp.svg" alt="SydostGuiden" />
      <div class="gap-4 stack">
        <div class="quiz-intro stack gap-2">
          <h1 class="display">Hitta en resa som passar dig</h1>
          <p class="text-faded">
            Svara på några korta frågor så samlar vi dina val och matchar dem
            med resor och upplevelser som passar dina rekommendationer bäst.
          </p>
        </div>
        <h2 id="questionTitle" aria-live="polite"></h2>
        <div class="row gap-3">
          <div class="progress-bar-container card width-full" role="progressbar" aria-label="Quizfrågor" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
            <div class="progress-bar"></div>
          </div>
          <h5></h5>
        </div>
      </div>
      <div class="stack gap-6" id="quiz-container"></div>
      <div class="row gap-4">
        <button id="prevBtn" class="width-full btn btn-secondary" type="button">
          Föregående
        </button>
        <button id="nextBtn" class="width-full btn btn-primary" type="button">Nästa</button>
      </div>
    </div>
    <section id="results" hidden></section>
    <div id="quizBtnDiv" hidden>
      <a href="index.html" class="btn btn-primary">Utforska fler platser</a>
      <button id="restartQuizBtn" type="button">Gör om quizet</button>
    </div>
  </body>
</html>
