<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resequiz</title>

    <script type="module" src="JS/quiz.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body class="height-screen">
    <div id="quiz-wrapper" class="justify-center height-full stack gap-10">
      <div class="btn-back">
        <h6 id="backBtn" class="btn">Tillbaka</h6>
      </div>
      <div class="gap-4 stack">
        <h1 class="display" id="questionTitle"></h1>
        <h5 class="text-faded" id="questionAnswerSupport"></h5>
        <div class="row gap-3">
          <div class="progress-bar-container card width-full">
            <div class="progress-bar"></div>
          </div>
          <h5 id="progress-counter"></h5>
        </div>
      </div>
      <div class="stack gap-6" id="quiz-container"></div>
      <div class="row gap-4">
        <button id="prevBtn" class="width-full btn btn-secondary">
          Föregående
        </button>
        <button id="nextBtn" class="width-full btn btn-primary">Nästa</button>
      </div>
    </div>
    <section id="results" hidden></section>
    <div id="quizBtnDiv" hidden>
      <button><a href="index.html">Utforska fler platser</a></button>
      <button id="restartQuizBtn">Gör om quizet</button>
    </div>
  </body>
</html>
