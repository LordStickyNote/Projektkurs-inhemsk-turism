<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>

    <script type="module" src="JS/quiz.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="height-screen" style="padding: var(--space-10)">
    <div class="justify-center height-full stack gap-10">
      <div class="btn-back">
        <a><h6 class="btn">Tillbaka</h6></a>
      </div>
      <div class="gap-4 stack">
        <h1 class="display"></h1>
        <div class="row gap-3">
          <div class="progress-bar-container card width-full">
            <div class="progress-bar"></div>
          </div>
          <h6>1/5</h6>
        </div>
      </div>
      <div class="stack gap-6" id="quiz-container">
       
      </div>
      <div class="row gap-4">
        <button id="prevBtn" class="width-full btn btn-secondary">Föregående</button>
        <button id="nextBtn" class="width-full btn btn-primary">Nästa</button>
      </div>
    </div>
  </body>
</html>
