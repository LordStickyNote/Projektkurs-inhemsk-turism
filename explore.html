<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utforska resor</title>
    <script type="module" src="JS/main.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <main class="gap-4 stack">
      <header id="header" class="gap-4 stack align-center">
        <span class="tab-container">
          <button class="tab" id="doBtn">Se och göra</button>
          <button class="tab" id="foodBtn">Mat</button>
          <button class="tab" id="accommodationBtn">Boenden</button>
        </span>
        <div id="toggleAndSortingDiv" class="width-full" hidden>
          <div class="width-full row row-between card">
            <select
              class="btn-outline sortingList"
              name="sortList"
              id="sortList"
            >
              <option value="rating">Högsta betyg</option>
              <option value="name">Namn A-Ö</option>
            </select>

            <span class="row gap-2 btn-square-container">
              <button id="favoritesBtn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 99.37 88.44"
                >
                  <path
                    d="M49.65,88.44L10.93,49.71C-19.25,19.53,19.48-19.19,49.65,10.99c30.28-30.28,69.01,8.44,38.72,38.72l-38.72,38.72Z"
                  />
                </svg>
                <span id="favoritesCount"></span>
              </button>
              <div class="vr"></div>
              <button
                id="listViewBtn"
                class="btn btn-square"
                aria-label="Visa som lista"
              >
                <svg
                  id="listViewIcon"
                  data-name="Lager 1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 94.77 94.77"
                >
                  <defs>
                    <style>
                      .cls-1 {
                        fill: #fff;
                      }
                    </style>
                  </defs>
                  <rect
                    class="cls-1"
                    x="53.93"
                    y="55.46"
                    width="40.84"
                    height="39.31"
                    rx="4.59"
                    ry="4.59"
                  />
                  <rect
                    class="cls-1"
                    y="55.46"
                    width="40.84"
                    height="39.31"
                    rx="4.59"
                    ry="4.59"
                  />
                  <rect
                    class="cls-1"
                    width="40.84"
                    height="39.31"
                    rx="4.59"
                    ry="4.59"
                  />
                  <rect
                    class="cls-1"
                    x="53.93"
                    width="40.84"
                    height="39.31"
                    rx="4.59"
                    ry="4.59"
                  />
                </svg>
              </button>
              <button
                id="mapViewBtn"
                class="btn btn-square"
                aria-label="Visa på karta"
              >
                <svg
                  id="mapViewIcon"
                  data-name="Lager 1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 71.56 100"
                >
                  <defs>
                    <style>
                      .cls-1 {
                        fill: #fff;
                      }
                    </style>
                  </defs>
                  <path
                    class="cls-1"
                    d="M35.78,0C16.02,0,0,15.76,0,35.19s16.02,35.19,35.78,35.19,35.78-15.76,35.78-35.19S55.54,0,35.78,0ZM35.78,48.74c-7.48,0-13.55-6.07-13.55-13.55s6.07-13.55,13.55-13.55,13.55,6.07,13.55,13.55-6.07,13.55-13.55,13.55Z"
                  />
                  <polyline
                    class="cls-1"
                    points="66.19 53.76 35.78 100 5.39 53.76"
                  />
                </svg>
              </button>
            </span>
          </div>
        </div>
      </header>
      <hr />
      <button id="btn-float-SeeAndDo" class="btn-float btn btn-primary">
        Filter
      </button>
      <div class="row" id="page-content">
        <div class="filter-menu-container" id="filter-menu-containerSeeAndDo">
          <h1
            class="display"
            style="padding: var(--space-8); box-sizing: border-box"
          >
            Filtrera resultat
          </h1>
          <div class="filter-menu">
            <div class="filter-category width-full">
              <div class="collapsible-header">
                <h3>Plats</h3>
                <hr />
              </div>
              <label class="card card-filter-option" for="municipalityFilter"
                ><h3>Kommun</h3>
                <select id="municipalityFilter">
                  <option value="">Alla kommuner</option>
                </select>
              </label>
            </div>
            <div id="SeeAndDoFilters" class="gap-8 stack width-full" hidden>
              <div class="filter-category width-full">
                <div class="collapsible-header">
                  <h3>Generella filter</h3>
                  <hr />
                </div>

                <label class="card card-filter-option" for="childFriendly"
                  ><h3>Barnvänligt</h3>
                  <input type="checkbox" id="childFriendly"
                /></label>

                <label class="card card-filter-option" for="priceRange"
                  ><h3>Pris</h3>
                  <select id="priceRange">
                    <option value="">Alla priser</option>
                    <option value="100">Upp till 100 kr</option>
                    <option value="200">Upp till 200 kr</option>
                    <option value="500">Upp till 500 kr</option>
                    <option value="1000">Upp till 1000 kr</option>
                  </select>
                </label>
              </div>

              <div id="activityFilters" class="width-full filter-category">
                <div class="collapsible-header">
                  <h3>Filtrera aktiviteter</h3>
                  <hr />
                </div>

                <h4>Typ av aktivitet</h4>
                <label class="card card-filter-option">
                  <h3>Nöje</h3>
                  <input type="checkbox" name="activityType" value="fun" />
                </label>
                <label class="card card-filter-option">
                  <h3>Sport</h3>
                  <input type="checkbox" name="activityType" value="sport" />
                </label>
                <label class="card card-filter-option">
                  <h3>Bad</h3>
                  <input type="checkbox" name="activityType" value="swim" />
                </label>
                <label class="card card-filter-option">
                  <h3>Äventyr</h3>
                  <input
                    type="checkbox"
                    name="activityType"
                    value="adventure"
                  />
                </label>
                <label class="card card-filter-option">
                  <h3>Nattliv</h3>
                  <input
                    type="checkbox"
                    name="activityType"
                    value="nightlife"
                  />
                </label>

                <label class="card card-filter-option" for="effort">
                  <h3>Aktivitetsnivå</h3>
                  <select id="effort">
                    <option value="">Alla nivåer</option>
                    <option value="LOW">Lugnt</option>
                    <option value="MEDIUM">Medel</option>
                    <option value="HIGH">Aktivt</option>
                  </select>
                </label>

                <label class="card card-filter-option" for="involvesAnimals">
                  <h3>Djur</h3>
                  <input type="checkbox" id="involvesAnimals" />
                </label>

                <label class="card card-filter-option" for="involvesWater">
                  <h3>Vatten</h3>
                  <input type="checkbox" id="involvesWater" />
                </label>
              </div>

              <div id="attractionFilters" class="filter-category width-full">
                <div class="collapsible-header">
                  <h3>Filtrera sevärdheter</h3>
                  <hr />
                </div>
                <h4>Typ av sevärdhet</h4>
                <label class="card card-filter-option">
                  <h3>Historia</h3>
                  <input
                    type="checkbox"
                    name="attractionType"
                    value="history"
                  />
                </label>
                <label class="card card-filter-option">
                  <h3>Konst & kultur</h3>
                  <input type="checkbox" name="attractionType" value="art" />
                </label>
                <label class="card card-filter-option">
                  <h3>Natur</h3>
                  <input type="checkbox" name="attractionType" value="nature" />
                </label>
                <label class="card card-filter-option">
                  <h3>Landmärke</h3>
                  <input
                    type="checkbox"
                    name="attractionType"
                    value="landmark"
                  />
                </label>
                <hr />

                <label class="card card-filter-option" for="experienceType">
                  <h3>Typ av upplevelse</h3>
                  <select id="experienceType">
                    <option value="">Alla</option>
                    <option value="interactive">Interaktiv</option>
                    <option value="static">Klassisk (se & läsa)</option>
                  </select>
                </label>

                <label class="card card-filter-option" for="localSignificance">
                  <h3>Lokala pärlor</h3>
                  <input type="checkbox" id="localSignificance" />
                </label>
              </div>
            </div>

            <div id="foodFilters" class="width-full" hidden>
              <div class="filter-category width-full">
                <div class="collapsible-header">
                  <h3>Typ av mat</h3>
                  <hr />
                </div>

                <div class="stack gap-2">
                  <label class="card card-filter-option">
                    <h3>Asiatiskt</h3>
                    <input type="checkbox" name="foodType" value="asian" />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Pizza</h3>
                    <input type="checkbox" name="foodType" value="pizza" />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Kebab</h3>
                    <input type="checkbox" name="foodType" value="kebab" />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Hamburgare</h3>
                    <input type="checkbox" name="foodType" value="hamburgare" />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Sallad</h3>
                    <input type="checkbox" name="foodType" value="sallad" />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Husman</h3>
                    <input type="checkbox" name="foodType" value="husman" />
                  </label>
                </div>

                <div class="collapsible-header">
                  <h3>Pris & betyg</h3>
                  <hr />
                </div>

                <label class="card card-filter-option" for="foodPrice">
                  <h3>Pris per person</h3>
                  <select id="foodPrice">
                    <option value="">Alla priser</option>
                    <option value="100">Upp till 100 kr</option>
                    <option value="200">Upp till 200 kr</option>
                    <option value="500">Upp till 500 kr</option>
                  </select>
                </label>

                <label class="card card-filter-option" for="foodRating">
                  <h3>Betyg</h3>
                  <select id="foodRating">
                    <option value="">Alla betyg</option>
                    <option value="3">3+</option>
                    <option value="4">4+</option>
                  </select>
                </label>
              </div>
            </div>

            <div id="accommodationFilters" class="width-full" hidden>
              <div class="filter-category width-full">
                <div class="collapsible-header">
                  <h3>Boendetyp</h3>
                  <hr />
                </div>

                <div class="stack gap-2">
                  <label class="card card-filter-option">
                    <h3>Hotell</h3>
                    <input
                      type="checkbox"
                      name="accommodationType"
                      value="Hotell"
                    />
                  </label>
                  <label class="card card-filter-option">
                    <h3>Camping</h3>
                    <input
                      type="checkbox"
                      name="accommodationType"
                      value="Camping"
                    />
                  </label>
                  <label class="card card-filter-option">
                    <h3>B&B</h3>
                    <input
                      type="checkbox"
                      name="accommodationType"
                      value="B&B"
                    />
                  </label>
                </div>

                <div class="collapsible-header">
                  <h3>Övriga krav</h3>
                  <hr />
                </div>

                <label
                  class="card card-filter-option"
                  for="accommodationRating"
                >
                  <h3>Betyg</h3>
                  <select id="accommodationRating">
                    <option value="">Alla betyg</option>
                    <option value="3">3+</option>
                    <option value="4">4+</option>
                    <option value="4.5">4.5+</option>
                  </select>
                </label>

                <label class="card card-filter-option" for="hasWifi">
                  <h3>Wifi</h3>
                  <input type="checkbox" id="hasWifi" />
                </label>

                <label class="card card-filter-option" for="freeParking">
                  <h3>Gratis parkering</h3>
                  <input type="checkbox" id="freeParking" />
                </label>

                <label class="card card-filter-option" for="petFriendly">
                  <h3>Tillåter husdjur</h3>
                  <input type="checkbox" id="petFriendly" />
                </label>
              </div>
            </div>
          </div>
          <div
            style="padding: var(--space-8); box-sizing: border-box"
            class="row gap-4 width-full"
          >
            <button class="btn btn-outline resetFilterBtn">Rensa filter</button>
            <button id="applyFilterBtn" class="btn btn-primary width-full">
              Visa resultat
            </button>
          </div>
        </div>
        <div class="stack gap-4 width-full" id="resultsContainer">
          <section id="quizNoticeContainer"></section>
          <p id="resultsCount" class="text-faded"></p>
          <section id="results"></section>
        </div>
      </div>
      <div id="favoritesModal" hidden>
        <div class="favorites-content">
          <div class="favorites-header">
            <div class="width-full row gap-4">
              <h2 style="text-wrap: nowrap">Sparade platser</h2>
              <button id="clear-favorites" class="btn btn-sm btn-secondary">
                Rensa favoriter
              </button>
            </div>
            <div class="width-full">
              <button id="closeFavoritesBtn">X</button>
            </div>
          </div>
          <hr />
          <section id="favoriteResults"></section>
        </div>
      </div>
      <div id="detailModal" hidden>
        <div id="detailContent"></div>
      </div>
     <div id="lower-page-btns" class="width-full align-center stack gap-4">
        <div class="row gap-4 justify-center">
          <button id="loadMoreBtn" class="btn btn-secondary">Ladda fler</button>
        </div>
        <hr />
        <div class="stack gap-10 width-fit">
          <div class="card row gap-4 width-fit">
            <h3>Hittar du inte det du söker? Gör vårt quiz!</h3>
            <a href="quiz.html" class="btn btn-primary"
              >Hitta en resa
              <svg
                id="Lager_1"
                data-name="Lager 1"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 73.68 94.12"
              >
                <path
                  class="cls-1"
                  d="M73.07,46.46h-26.7c-.37,0-.66-.11-.6-.23L67.71.23c.11-.23-.87-.32-1.16-.11L.05,49.79c-.17.13.12.27.56.27h28.78c.37,0,.66.11.6.23l-20.79,43.6c-.11.23.87.32,1.16.11l63.27-47.26c.17-.13-.12-.27-.56-.27Z"
                />
              </svg>
            </a>
          </div>
        </div>
     </div>

      <hr />
    </main>
  </body>
</html>
