<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SydostGuiden</title>
    <link rel="icon" href="/img/logotyp.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="stylesheet" href="/CSS/start-page.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="height-screen" id="start-page-bg">
    <div id="content-container" class="justify-center height-full stack gap-10">
      <div class="gap-4 stack">
        <img class="explore-logo" src="/img/logotyp.svg" alt="SydostGuiden" />
        <h1 class="display">
          Hitta reseställe i <span class="display-italic">Småland</span> och
          <span class="display-italic">Öland</span>
        </h1>
        <p class="text-faded">Leta bland mer än 800 olika ställen!</p>
      </div>
      <div class="row gap-4">
        <a href="/explore.html" class="width-full btn btn-secondary"
          >Utforska<img
            src="/img/kompass.svg"
            alt=""
            style="width: 16px; height: 16px; filter: invert(1)"
        /></a>
        <a href="/quiz.html" class="width-full btn btn-primary"
          >Hitta en resa<img
            src="/img/blixt.svg"
            alt=""
            style="width: 16px; height: 16px"
        /></a>
      </div>
    </div>
  </body>
</html>
