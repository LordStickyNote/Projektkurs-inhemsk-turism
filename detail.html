<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detaljsida</title>
    <script type="module" src="JS/detail.js"></script>
    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="gap-4">
    <section class="stack gap-8">
      <div class="width-full">
        <!-- Bild kan läggas här -->
      </div>

      <div class="gap-2 stack">
        <div class="row row-between align-center">
          <h2 id="detail-name">Laddar...</h2>

          <span class="star-container">
            <svg class="star" viewBox="0 0 16 16">
              <path
                d="M7.71954 0.445459C7.86922 -0.0151958 8.52092 -0.0151964 8.6706 0.445459L9.76667 3.81881C9.8336 4.02483 10.0256 4.16431 10.2422 4.16431H13.7892C14.2735 4.16431 14.4749 4.78411 14.083 5.06881L11.2135 7.15366C11.0383 7.28098 10.9649 7.50667 11.0319 7.71268L12.1279 11.086C12.2776 11.5467 11.7504 11.9298 11.3585 11.6451L8.48896 9.5602C8.31372 9.43288 8.07642 9.43288 7.90118 9.5602L5.03163 11.6451C4.63977 11.9298 4.11253 11.5467 4.26221 11.086L5.35828 7.71268C5.42521 7.50667 5.35188 7.28098 5.17664 7.15366L2.30709 5.06881C1.91524 4.78411 2.11662 4.16431 2.60099 4.16431H6.14794C6.36455 4.16431 6.55653 4.02483 6.62347 3.81881L7.71954 0.445459Z"
              ></path>
            </svg>
          </span>
        </div>

        <div class="row row-between align-center">
          <h4 class="text-faded" id="detail-location-type">Laddar...</h4>
          <h4 class="text-faded" id="detail-price">Laddar...</h4>
        </div>
      </div>

      <hr />

      <div class="card stack">
        <div class="stack width-full gap-2">
          <h3>Beskrivning</h3>
          <div class="text-faded">
            <p id="detail-description">Laddar...</p>
          </div>
        </div>
      </div>

      <div class="card stack gap-4">
        <div class="width-full gap-2 stack">
          <h3>Kontakt</h3>

          <span class="row gap-2">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 11.5a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.82 16z"
              ></path>
            </svg>
            <p id="detail-phone">Laddar...</p>
          </span>

          <span class="row gap-2">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              ></path>
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              ></path>
            </svg>
            <a id="detail-website" href="#" target="_blank">Laddar...</a>
          </span>
        </div>

        <hr />

        <div class="stack width-full gap-4">
          <h3>Information</h3>

          <div class="details">
            <span>
              <span class="text-faded">Kostnad</span>
              <span id="detail-info-price">Laddar...</span>
            </span>

            <hr />

            <span>
              <span class="text-faded">Utomhus</span>
              <span id="detail-outdoors">Laddar...</span>
            </span>

            <hr />

            <span>
              <span class="text-faded">Barnrabatt</span>
              <span id="detail-child-discount">Laddar...</span>
            </span>

            <hr />

            <span>
              <span class="text-faded">Studentrabatt</span>
              <span id="detail-student-discount">Laddar...</span>
            </span>

            <hr />

            <span>
              <span class="text-faded">Seniorrabatt</span>
              <span id="detail-senior-discount">Laddar...</span>
            </span>
          </div>
        </div>
      </div>

      <div class="card stack">
        <div class="stack width-full gap-2">
          <h3>Väder</h3>
          <div class="text-faded">
            <p>Information om väder</p>
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="stack width-full gap-4">
          <div class="row row-between">
            <span class="row gap-2">
              <h3>Recensioner</h3>
              <h3 class="text-faded" id="detail-review-count">Laddar...</h3>
            </span>

            <span class="row">
              <h4 id="detail-rating">Laddar...</h4>
              <svg class="star" viewBox="0 0 16 16">
                <path
                  d="M7.71954 0.445459C7.86922 -0.0151958 8.52092 -0.0151964 8.6706 0.445459L9.76667 3.81881C9.8336 4.02483 10.0256 4.16431 10.2422 4.16431H13.7892C14.2735 4.16431 14.4749 4.78411 14.083 5.06881L11.2135 7.15366C11.0383 7.28098 10.9649 7.50667 11.0319 7.71268L12.1279 11.086C12.2776 11.5467 11.7504 11.9298 11.3585 11.6451L8.48896 9.5602C8.31372 9.43288 8.07642 9.43288 7.90118 9.5602L5.03163 11.6451C4.63977 11.9298 4.11253 11.5467 4.26221 11.086L5.35828 7.71268C5.42521 7.50667 5.35188 7.28098 5.17664 7.15366L2.30709 5.06881C1.91524 4.78411 2.11662 4.16431 2.60099 4.16431H6.14794C6.36455 4.02483 6.55653 4.02483 6.62347 3.81881L7.71954 0.445459Z"
                ></path>
              </svg>
            </span>
          </div>

          <div id="reviews">
            <!-- Recensioner kan läggas in här senare -->
          </div>
        </div>
      </div>

      <hr />

      <h2>Platser i närheten</h2>

      <section class="grid gap-6" id="results">
        <!-- Platser i närheten kan läggas in här senare -->
      </section>
    </section>
  </body>
</html>
